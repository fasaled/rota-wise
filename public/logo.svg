<svg viewBox="0 0 360 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon (scaled 80×80 from 512×512) -->
  <g transform="scale(0.15625)">
    <!-- No outer background — transparent for logo usage -->

    <!-- Calendar header bar -->
    <rect x="72" y="96" width="368" height="56" rx="12" fill="#2563EB"/>

    <!-- Calendar peg hooks -->
    <rect x="160" y="68" width="24" height="52" rx="12" fill="#93C5FD"/>
    <rect x="328" y="68" width="24" height="52" rx="12" fill="#93C5FD"/>

    <!-- Grid: 4 cols × 3 rows -->
    <!-- Row 0 -->
    <rect x="72"  y="176" width="80" height="80" rx="12" fill="#1E293B"/>
    <rect x="168" y="176" width="80" height="80" rx="12" fill="#1E293B"/>
    <rect x="264" y="176" width="80" height="80" rx="12" fill="white" fill-opacity="0.9"/>
    <rect x="360" y="176" width="80" height="80" rx="12" fill="#1E293B"/>
    <!-- Row 1 -->
    <rect x="72"  y="272" width="80" height="80" rx="12" fill="#3B82F6"/>
    <rect x="168" y="272" width="80" height="80" rx="12" fill="#1E293B"/>
    <rect x="264" y="272" width="80" height="80" rx="12" fill="#1E293B"/>
    <rect x="360" y="272" width="80" height="80" rx="12" fill="white" fill-opacity="0.9"/>
    <!-- Row 2 -->
    <rect x="72"  y="368" width="80" height="80" rx="12" fill="#1E293B"/>
    <rect x="168" y="368" width="80" height="80" rx="12" fill="white" fill-opacity="0.9"/>
    <rect x="264" y="368" width="80" height="80" rx="12" fill="#3B82F6"/>
    <rect x="360" y="368" width="80" height="80" rx="12" fill="#1E293B"/>
  </g>

  <!-- Wordmark: "Rota" bold + "wise" regular -->
  <text
    x="92"
    y="54"
    font-family="'Geist Sans', system-ui, -apple-system, sans-serif"
    font-weight="700"
    font-size="44"
    letter-spacing="-1.5"
    fill="#0F172A"
  >Rota</text>
  <text
    x="220"
    y="54"
    font-family="'Geist Sans', system-ui, -apple-system, sans-serif"
    font-weight="400"
    font-size="44"
    letter-spacing="-1.5"
    fill="#2563EB"
  >wise</text>
</svg>
