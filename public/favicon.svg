<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="#0F172A"/>

  <!-- Calendar header bar -->
  <rect x="72" y="96" width="368" height="56" rx="12" fill="#2563EB"/>

  <!-- Calendar peg hooks -->
  <rect x="160" y="68" width="24" height="52" rx="12" fill="#93C5FD"/>
  <rect x="328" y="68" width="24" height="52" rx="12" fill="#93C5FD"/>

  <!-- Grid: 4 cols × 3 rows, each 80×80, gap 16 -->
  <!-- Cols x = 72, 168, 264, 360 | Rows y = 176, 272, 368 -->

  <!-- Row 0 -->
  <rect x="72"  y="176" width="80" height="80" rx="12" fill="white" fill-opacity="0.10"/>
  <rect x="168" y="176" width="80" height="80" rx="12" fill="white" fill-opacity="0.10"/>
  <rect x="264" y="176" width="80" height="80" rx="12" fill="white" fill-opacity="0.85"/>
  <rect x="360" y="176" width="80" height="80" rx="12" fill="white" fill-opacity="0.10"/>

  <!-- Row 1 -->
  <rect x="72"  y="272" width="80" height="80" rx="12" fill="#3B82F6"/>
  <rect x="168" y="272" width="80" height="80" rx="12" fill="white" fill-opacity="0.10"/>
  <rect x="264" y="272" width="80" height="80" rx="12" fill="white" fill-opacity="0.10"/>
  <rect x="360" y="272" width="80" height="80" rx="12" fill="white" fill-opacity="0.85"/>

  <!-- Row 2 -->
  <rect x="72"  y="368" width="80" height="80" rx="12" fill="white" fill-opacity="0.10"/>
  <rect x="168" y="368" width="80" height="80" rx="12" fill="white" fill-opacity="0.85"/>
  <rect x="264" y="368" width="80" height="80" rx="12" fill="#3B82F6"/>
  <rect x="360" y="368" width="80" height="80" rx="12" fill="white" fill-opacity="0.10"/>
</svg>
